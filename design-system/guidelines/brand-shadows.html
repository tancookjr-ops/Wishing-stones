<!-- @dsCard group="Brand" viewport="700x180" name="Shadows & Props" subtitle="Soft warm shadows; taped objects get a propped offset" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--sand-100);font-family:var(--font-body)}
  .wrap{padding:26px 28px;display:flex;gap:26px;align-items:center}
  .c{width:120px;height:80px;background:var(--sand-50);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;color:var(--sea-900);font-weight:600}
  .prop{transform:rotate(-2deg);box-shadow:var(--shadow-prop);border:1px solid var(--border-hairline)}
</style></head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#E4674A"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">WS</text></svg></template><div class="wrap">
  <div class="c" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="c" style="box-shadow:var(--shadow-md)">md</div>
  <div class="c" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="c prop">prop</div>
</div></body></html>
