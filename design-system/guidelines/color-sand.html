<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .row{display:flex;gap:2px;padding:16px}
  .sw{flex:1;height:110px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;color:var(--driftwood-900);font-size:12px}
  .sw b{font-family:var(--font-display);font-weight:600;display:block}
  .sw code{font-size:10px;opacity:.7}
</style></head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#E4674A"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">WS</text></svg></template><div class="row">
  <div class="sw" style="background:var(--sand-50);border:1px solid #eee"><b>sand-50</b><code>#FBF7EE</code></div>
  <div class="sw" style="background:var(--sand-100)"><b>sand-100</b><code>#F6F0E1</code></div>
  <div class="sw" style="background:var(--sand-200)"><b>sand-200</b><code>#EDE3CE</code></div>
  <div class="sw" style="background:var(--sand-300)"><b>sand-300</b><code>#E0D2B5</code></div>
</div></body></html>
