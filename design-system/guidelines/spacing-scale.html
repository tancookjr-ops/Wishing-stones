<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font-body)}
  .wrap{padding:20px 28px;display:flex;align-items:flex-end;gap:14px}
  .col{text-align:center}
  .bar{background:var(--seaglass-400);border-radius:4px}
  .n{font-family:var(--font-display);font-size:12px;color:var(--sea-900);margin-top:6px;font-weight:600}
  .px{font-size:10px;color:var(--text-faint)}
</style></head>
<body>

  <div class="col"><div class="bar" style="width:22px;height:4px"></div><div class="n">1</div><div class="px">4</div></div>

  <div class="col"><div class="bar" style="width:22px;height:48px"></div><div class="n">7</div><div class="px">48</div></div>
  <div class="col"><div class="bar" style="width:22px;height:64px"></div><div class="n">8</div><div class="px">64</div></div>
  <div class="col"><div class="bar" style="width:22px;height:88px"></div><div class="n">9</div><div class="px">96</div></div>
</div></body></html>
