<!-- @dsCard group="Colors" viewport="700x170" name="Sea, Tide & Glass" subtitle="The water — brand greens and blues" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff}
  .wrap{padding:16px}
  .row{display:flex;gap:2px;margin-bottom:2px}
  .sw{flex:1;height:60px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:11px}
  .sw b{font-family:var(--font-display);font-weight:600;display:block;font-size:12px}
  .sw code{font-size:9px;opacity:.75}
</style></head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#E4674A"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">WS</text></svg></template><div class="wrap">
  <div class="row">
    <div class="sw" style="background:var(--sea-900);color:#fff"><b>sea-900</b><code>#1C3A3D</code></div>
    <div class="sw" style="background:var(--sea-700);color:#fff"><b>sea-700</b><code>#2E5A5C</code></div>
    <div class="sw" style="background:var(--sea-500);color:#fff"><b>sea-500</b><code>#3E7C7B</code></div>
    <div class="sw" style="background:var(--seaglass-600);color:#fff"><b>seaglass-600</b><code>#5E9B87</code></div>
  </div>
  <div class="row">
    <div class="sw" style="background:var(--seaglass-400);color:var(--sea-900)"><b>seaglass-400</b><code>#8FC4B0</code></div>
    <div class="sw" style="background:var(--seaglass-200);color:var(--sea-900)"><b>seaglass-200</b><code>#CBE3D8</code></div>
    <div class="sw" style="background:var(--tide-500);color:#fff"><b>tide-500</b><code>#6FA3B4</code></div>
    <div class="sw" style="background:var(--tide-300);color:var(--sea-900)"><b>tide-300</b><code>#A9CBD6</code></div>
  </div>
</div></body></html>
