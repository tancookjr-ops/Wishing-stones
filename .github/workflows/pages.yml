name: Publish to GitHub Pages

# Installed by repo-onboard. The hosting FALLBACK (and the sandbox while no FTP
# server is set up). Publishes ONE GitHub Pages site:
#   /          production = the Production branch (+ EXTRA_PATHS from scripts/site.conf)
#   /staging/  staging    = the Develop branch, sandboxed (own storage keys, badge)
# Called by deploy-staging.yml, promote.yml and deploy.yml; also runnable by hand.
# Needs Settings → Pages → Source = "GitHub Actions" (one-time switch).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out Production
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: Production
          path: prod

      - name: Check out Develop
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: Develop
          path: dev

      - name: Package the site
        # Uses the staging branch's copy of the scripts (always the newest).
        run: |
          set -euo pipefail
          if [ -f prod/index.html ]; then
            bash dev/scripts/package-site.sh prod _site production
          else
            # Production has never been promoted yet: hold the live address with a placeholder.
            mkdir -p _site
            printf '%s\n' '<!doctype html><html lang="en-CA"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wishing Stones · coming soon</title><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#F6EEDF;color:#1F3A3D;font:18px/1.5 Georgia,serif"><p>Wishing Stones, Tancook Island — coming soon.</p></body></html>' > _site/index.html
            echo "⚠ Production has no site yet (never promoted) — published a coming-soon page at /" >> "$GITHUB_STEP_SUMMARY"
          fi
          bash dev/scripts/package-site.sh dev _site/staging staging
          touch _site/.nojekyll
          {
            echo "### Published to GitHub Pages"
            echo "- Production: \`$(git -C prod rev-parse --short HEAD)\` (Production)"
            echo "- Staging: \`$(git -C dev rev-parse --short HEAD)\` (Develop) at /staging/"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
