# Installed by repo-onboard (adapted from BorealCodex). Grouped update pull requests
# into Develop with a 7-day cooldown, so a freshly published (possibly
# poisoned) version is never adopted the day it appears.
# Needs Dependabot turned on: Settings → Code security → Dependabot version updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/design-system/tools"
    target-branch: "Develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
